<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>My Training Programme</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F8FC;
    --white: #FFFFFF;
    --ink: #0F0F1A;
    --ink2: #5A5A72;
    --ink3: #A0A0B8;
    --coral: #FF5C5C;
    --coral-soft: #FFF0F0;
    --coral-mid: #FFCECE;
    --green: #22C27A;
    --green-soft: #EDFAF4;
    --border: #EAEAF2;
    --shadow: 0 2px 16px rgba(15,15,26,0.07);
    --shadow-lg: 0 8px 32px rgba(15,15,26,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }

  .screen { display: none; height: 100vh; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }

  /* ══ HOME ══ */
  #home {
    background: linear-gradient(160deg, #FF5C5C 0%, #FF8C69 55%, #FFB347 100%);
    color: white;
  }
  .home-inner { flex: 1; overflow-y: auto; padding: 56px 24px 32px; display: flex; flex-direction: column; }
  .home-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; margin-bottom: 12px; }
  .home-title { font-size: clamp(40px, 11vw, 60px); font-weight: 800; line-height: 1.05; margin-bottom: 40px; letter-spacing: -0.02em; }
  .home-title em { font-style: normal; opacity: 0.55; }
  .programme-list { display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .programme-card {
    background: rgba(255,255,255,0.18); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.3); border-radius: 20px;
    padding: 22px 20px; cursor: pointer; transition: all 0.2s;
  }
  .programme-card:active { background: rgba(255,255,255,0.28); transform: scale(0.98); }
  .pc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .pc-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
  .pc-weeks { font-size: 11px; background: rgba(255,255,255,0.25); border-radius: 20px; padding: 3px 10px; font-weight: 600; }
  .pc-name { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 4px; }
  .pc-desc { font-size: 13px; opacity: 0.72; font-weight: 500; }
  .home-footer { font-size: 11px; opacity: 0.45; font-weight: 500; padding-top: 24px; letter-spacing: 0.05em; }

  .home-progress-btn {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border: 1px solid rgba(255,255,255,0.3); border-radius: 16px;
    background: rgba(255,255,255,0.15); color: white; cursor: pointer; width: 100%;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 600;
    margin-top: 14px; transition: all 0.15s; letter-spacing: 0.01em;
  }
  .home-progress-btn:active { background: rgba(255,255,255,0.25); }
  .hpb-left { display: flex; align-items: center; gap: 10px; }
  .hpb-dot { width: 8px; height: 8px; border-radius: 50%; background: white; opacity: 0.8; }
  .hpb-count { font-size: 13px; opacity: 0.75; font-weight: 600; }

  /* ══ SHARED TOP BAR ══ */
  .top-bar {
    display: flex; align-items: center; gap: 14px; padding: 16px 20px;
    background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .back-btn {
    width: 38px; height: 38px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--ink); font-size: 18px; flex-shrink: 0; transition: all 0.15s; box-shadow: var(--shadow);
  }
  .back-btn:active { background: var(--bg); }
  .top-bar-title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }

  /* ══ PICKER ══ */
  #picker { background: var(--bg); }
  .picker-body { flex: 1; overflow-y: auto; padding: 20px 20px 120px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); margin-bottom: 12px; }

  .week-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .week-tab {
    padding: 9px 18px; border: 1.5px solid var(--border); border-radius: 50px;
    background: var(--white); cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px; font-weight: 600; color: var(--ink2); transition: all 0.15s;
    box-shadow: var(--shadow);
  }
  .week-tab.active { background: var(--ink); color: white; border-color: var(--ink); }

  .session-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .session-card {
    padding: 20px 16px; border: 2px solid var(--border); border-radius: 20px;
    background: var(--white); cursor: pointer; transition: all 0.15s; text-align: left;
    box-shadow: var(--shadow);
  }
  .session-card.selected { border-color: var(--coral); background: var(--coral-soft); }
  .sc-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--coral); margin-bottom: 6px; }
  .sc-name { font-size: 17px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }

  .block-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .block-item {
    padding: 16px 18px; border: 1.5px solid var(--border); border-radius: 16px;
    background: var(--white); display: flex; justify-content: space-between; align-items: center;
    box-shadow: var(--shadow);
  }
  .bi-name { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
  .bi-meta { font-size: 12px; color: var(--ink3); font-weight: 500; }
  .bi-arrow { color: var(--ink3); font-size: 18px; font-weight: 300; }

  .start-bar {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 16px 20px 24px;
    background: var(--white); border-top: 1px solid var(--border);
  }
  .start-bar button {
    width: 100%; padding: 18px; background: linear-gradient(135deg, #FF5C5C, #FF8C69);
    color: white; border: none; border-radius: 16px;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s; letter-spacing: 0.01em;
    box-shadow: 0 4px 20px rgba(255,92,92,0.35);
  }
  .start-bar button:active { opacity: 0.88; }

  /* ══ BLOCK VIEW ══ */
  #blockview { background: var(--bg); }
  .bv-topbar {
    display: flex; align-items: center; gap: 14px; padding: 16px 20px;
    background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .bv-info { flex: 1; min-width: 0; }
  .bv-session-name { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--coral); margin-bottom: 2px; }
  .bv-block-name { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }

  .block-progress {
    display: flex; gap: 5px; padding: 14px 20px;
    background: var(--white); border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto;
  }
  .bp-dot { flex: 1; height: 5px; border-radius: 10px; background: var(--border); transition: background 0.3s; min-width: 20px; }
  .bp-dot.done { background: var(--green); }
  .bp-dot.active { background: var(--coral); }

  .bv-body { flex: 1; overflow-y: auto; padding: 16px 16px 100px; }

  .equip-banner {
    padding: 14px 16px; background: var(--coral-soft); border: 1.5px solid var(--coral-mid);
    border-radius: 16px; margin-bottom: 16px;
  }
  .equip-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--coral); margin-bottom: 6px; }
  .equip-items { font-size: 13px; color: var(--ink); line-height: 1.9; font-weight: 500; }

  .rounds-badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; background: var(--white); border: 1.5px solid var(--border);
    border-radius: 50px; font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .rb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); }

  .ex-card {
    border: 1.5px solid var(--border); border-radius: 18px; margin-bottom: 10px;
    background: var(--white); overflow: hidden; transition: all 0.2s; box-shadow: var(--shadow);
  }
  .ex-card.completed { border-color: var(--green); background: var(--green-soft); opacity: 0.75; box-shadow: none; }
  .ex-card.active-ex { border-color: var(--coral); box-shadow: 0 4px 20px rgba(255,92,92,0.15); }

  .ex-main {
    display: flex; align-items: flex-start; gap: 14px; padding: 16px;
    cursor: pointer; transition: background 0.12s;
  }
  .ex-main:active { background: var(--bg); }

  .ex-check {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.2s; margin-top: 1px;
  }
  .ex-card.completed .ex-check { background: var(--green); border-color: var(--green); }
  .ex-card.active-ex .ex-check { border-color: var(--coral); }
  .check-icon { display: none; color: white; font-size: 14px; font-weight: 700; }
  .ex-card.completed .check-icon { display: block; }

  .ex-text { flex: 1; }
  .ex-name { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 5px; line-height: 1.3; letter-spacing: -0.01em; }
  .ex-card.completed .ex-name { text-decoration: line-through; color: var(--ink3); }
  .ex-spec-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ex-spec {
    font-size: 12px; font-weight: 700; color: var(--coral);
    background: var(--coral-soft); border-radius: 20px; padding: 3px 10px;
  }
  .ex-weight { font-size: 12px; font-weight: 500; color: var(--ink2); }
  .ex-note { font-size: 12px; color: var(--ink2); font-style: italic; padding: 0 16px 14px 58px; line-height: 1.6; font-weight: 500; }

  .ex-timer-section {
    border-top: 1px solid var(--border); padding: 14px 16px; background: var(--bg); display: none;
  }
  .ex-card.active-ex .ex-timer-section { display: block; }
  .timer-start-btn {
    width: 100%; padding: 14px; background: linear-gradient(135deg, #FF5C5C, #FF8C69);
    color: white; border: none; border-radius: 12px;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s; box-shadow: 0 3px 12px rgba(255,92,92,0.3);
  }
  .timer-start-btn:active { opacity: 0.85; }

  /* ══ TIMER OVERLAY ══ */
  #timerOverlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0F0F1A 0%, #1E1030 100%); color: white;
  }
  #timerOverlay.visible { display: flex; }

  .to-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--coral); margin-bottom: 10px; opacity: 0.9; }
  .to-exercise { font-size: clamp(22px, 6vw, 30px); font-weight: 800; text-align: center; margin-bottom: 44px; padding: 0 32px; line-height: 1.25; letter-spacing: -0.01em; }

  .to-ring-wrap { position: relative; width: 210px; height: 210px; margin-bottom: 44px; }
  .to-ring-svg { transform: rotate(-90deg); }
  .to-ring-bg { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 10; }
  .to-ring-fill { fill: none; stroke: var(--coral); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.9s linear, stroke 0.3s; }
  .to-ring-fill.warning { stroke: #FFB347; }
  .to-number {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 80px; font-weight: 800; line-height: 1; letter-spacing: -0.03em;
  }
  .to-number.warning { color: #FFB347; }

  .to-countdown-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0F0F1A, #1E1030); border-radius: 50%;
    font-size: 88px; font-weight: 800; color: var(--coral); transition: opacity 0.2s; letter-spacing: -0.03em;
  }
  .to-countdown-overlay.hidden { opacity: 0; pointer-events: none; }

  .to-phase { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 36px; }

  .to-controls { display: flex; gap: 12px; }
  .to-btn {
    padding: 14px 28px; border: 1.5px solid rgba(255,255,255,0.15); border-radius: 50px;
    background: rgba(255,255,255,0.07); color: white;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all 0.15s; letter-spacing: 0.02em;
  }
  .to-btn:active { background: rgba(255,255,255,0.15); }
  .to-btn.primary { background: var(--coral); border-color: var(--coral); box-shadow: 0 4px 16px rgba(255,92,92,0.4); }
  .to-btn.primary:active { opacity: 0.85; }

  /* ══ BLOCK COMPLETE ══ */
  #blockComplete {
    display: none; position: fixed; inset: 0; z-index: 90;
    flex-direction: column; align-items: center; justify-content: center;
    background: var(--white); text-align: center; padding: 40px 28px;
  }
  #blockComplete.visible { display: flex; }
  .bc-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, #FF5C5C, #FF8C69);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 24px;
    box-shadow: 0 8px 28px rgba(255,92,92,0.3);
  }
  .bc-title { font-size: 40px; font-weight: 800; margin-bottom: 12px; line-height: 1.1; letter-spacing: -0.02em; color: var(--ink); }
  .bc-title em { font-style: normal; color: var(--coral); }
  .bc-sub { font-size: 14px; color: var(--ink2); margin-bottom: 44px; line-height: 1.7; font-weight: 500; max-width: 300px; }
  .bc-btn {
    width: 100%; max-width: 340px; padding: 18px;
    background: linear-gradient(135deg, #FF5C5C, #FF8C69); color: white;
    border: none; border-radius: 16px; font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(255,92,92,0.3); transition: opacity 0.15s;
  }
  .bc-btn:active { opacity: 0.88; }
  .bc-btn.secondary {
    background: none; color: var(--ink2); border: 1.5px solid var(--border);
    box-shadow: none; font-size: 14px;
  }

  /* ══ SESSION COMPLETE ══ */
  #sessionComplete {
    background: linear-gradient(160deg, #FF5C5C 0%, #FF8C69 55%, #FFB347 100%);
    color: white; align-items: center; justify-content: center; text-align: center; padding: 48px 28px;
  }
  .sc-icon {
    width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center; font-size: 36px;
    margin: 0 auto 24px; border: 2px solid rgba(255,255,255,0.4);
  }
  .sc-title { font-size: 52px; font-weight: 800; line-height: 1.05; margin-bottom: 16px; letter-spacing: -0.02em; }
  .sc-title em { font-style: normal; opacity: 0.6; }
  .sc-sub { font-size: 14px; opacity: 0.8; line-height: 1.7; margin-bottom: 48px; font-weight: 500; }
  .sc-home-btn {
    padding: 16px 36px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50px;
    background: rgba(255,255,255,0.2); color: white;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.15s; display: inline-block; margin: 6px;
    backdrop-filter: blur(4px);
  }
  .sc-home-btn:active { background: rgba(255,255,255,0.3); }

  /* ══ PROGRESS SCREEN ══ */
  #progress { background: var(--bg); }
  .progress-body { flex: 1; overflow-y: auto; padding: 20px 16px 60px; }

  .prog-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .prog-stat {
    padding: 18px 10px; background: var(--white); border: 1.5px solid var(--border);
    border-radius: 18px; text-align: center; box-shadow: var(--shadow);
  }
  .prog-stat-num { font-size: 34px; font-weight: 800; color: var(--coral); line-height: 1; margin-bottom: 5px; letter-spacing: -0.02em; }
  .prog-stat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink3); }

  .prog-week { margin-bottom: 24px; }
  .prog-week-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink3);
    margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
  }
  .prog-week-title::after { content: ''; flex: 1; height: 1.5px; background: var(--border); border-radius: 2px; }

  .prog-session-row {
    display: flex; align-items: center; gap: 14px; padding: 16px;
    border: 1.5px solid var(--border); border-radius: 16px; background: var(--white);
    margin-bottom: 8px; box-shadow: var(--shadow);
  }
  .prog-session-row.done { border-color: var(--green); background: var(--green-soft); box-shadow: none; }
  .prog-session-row.current { border-color: var(--coral); background: var(--coral-soft); }

  .psr-tick {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-size: 14px; color: transparent; transition: all 0.2s; font-weight: 700;
  }
  .prog-session-row.done .psr-tick { background: var(--green); border-color: var(--green); color: white; }
  .prog-session-row.current .psr-tick { border-color: var(--coral); }

  .psr-info { flex: 1; }
  .psr-name { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
  .prog-session-row.done .psr-name { color: var(--ink2); }
  .psr-meta { font-size: 12px; font-weight: 500; color: var(--ink3); }
  .prog-session-row.done .psr-meta { color: var(--green); font-weight: 600; }
  .prog-session-row.current .psr-meta { color: var(--coral); font-weight: 600; }

  .psr-badge {
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 5px 11px; border-radius: 50px; flex-shrink: 0;
  }
  .prog-session-row.done .psr-badge { background: var(--green); color: white; }
  .prog-session-row.current .psr-badge { background: var(--coral); color: white; }
  .prog-session-row:not(.done):not(.current) .psr-badge { background: var(--border); color: var(--ink3); }

  .prog-reset-btn {
    margin-top: 32px; width: 100%; padding: 16px; background: var(--white);
    border: 1.5px solid var(--border); border-radius: 14px; color: var(--ink3);
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow);
  }
  .prog-reset-btn:active { background: var(--bg); }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-inner">
    <div class="home-eyebrow">My Training</div>
    <div class="home-title">Move<br><em>Well</em></div>
    <div class="programme-list" id="programmeList"></div>
    <button class="home-progress-btn" onclick="showProgressScreen()">
      <div class="hpb-left"><div class="hpb-dot"></div>My Progress</div>
      <div class="hpb-count" id="homeProgressCount"></div>
    </button>
    <div class="home-footer">4-WEEK PROGRAMME · 2 SESSIONS / WEEK</div>
  </div>
</div>

<!-- PROGRESS SCREEN -->
<div id="progress" class="screen">
  <div class="top-bar">
    <button class="back-btn" onclick="showScreen('home')">←</button>
    <div class="top-bar-title">My Progress</div>
  </div>
  <div class="progress-body" id="progressBody"></div>
</div>

<!-- SESSION PICKER -->
<div id="picker" class="screen">
  <div class="top-bar">
    <button class="back-btn" onclick="showScreen('home')">←</button>
    <div class="top-bar-title" id="pickerTitle"></div>
  </div>
  <div class="picker-body">
    <div class="section-label">Select Week</div>
    <div class="week-tabs" id="weekTabs"></div>
    <div class="section-label">Select Session</div>
    <div class="session-grid" id="sessionGrid"></div>
    <div id="blockListWrap" style="display:none">
      <div class="section-label" style="margin-bottom:12px">Session Overview</div>
      <div class="block-list" id="blockListPreview"></div>
    </div>
  </div>
  <div class="start-bar">
    <button onclick="startSession()">Begin Session →</button>
  </div>
</div>

<!-- BLOCK VIEW -->
<div id="blockview" class="screen">
  <div class="bv-topbar">
    <button class="back-btn" onclick="confirmExitBlock()">←</button>
    <div class="bv-info">
      <div class="bv-session-name" id="bvSessionName"></div>
      <div class="bv-block-name" id="bvBlockName"></div>
    </div>
  </div>
  <div class="block-progress" id="blockProgressDots"></div>
  <div class="bv-body" id="bvBody"></div>
</div>

<!-- SESSION COMPLETE -->
<div id="sessionComplete" class="screen">
  <div class="sc-icon">✦</div>
  <div class="sc-title">Well<br><em>done.</em></div>

const CIRCUMFERENCE = 2 * Math.PI * 88; // r=88

// ══════════════════════════════════════════
// SCREENS
// ══════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ══════════════════════════════════════════
// HOME
// ══════════════════════════════════════════
function renderHome() {
  const list = document.getElementById('programmeList');
  list.innerHTML = '';
  programmes.forEach(p => {
    const card = document.createElement('div');
    card.className = 'programme-card';
    card.innerHTML = `
      <div class="pc-top"><span class="pc-label">${p.label}</span><span class="pc-weeks">${p.weeks.length} weeks</span></div>
      <div class="pc-name">${p.name}</div>
      <div class="pc-desc">${p.description}</div>
    `;
    card.onclick = () => openProgramme(p);
    list.appendChild(card);
  });
}

function openProgramme(p) {
  S.programme = p;
  S.weekIdx = 0;
  S.sessionKey = null;
  document.getElementById('pickerTitle').textContent = p.name;
  renderWeekTabs();
  renderSessionGrid();
  showScreen('picker');
}

// ══════════════════════════════════════════
// PICKER
// ══════════════════════════════════════════
function renderWeekTabs() {
  const el = document.getElementById('weekTabs');
  el.innerHTML = '';
  S.programme.weeks.forEach((w, i) => {
    const b = document.createElement('button');
    b.className = 'week-tab' + (i === S.weekIdx ? ' active' : '');
    b.textContent = `Week ${w.week}`;
    b.onclick = () => { S.weekIdx = i; S.sessionKey = null; renderWeekTabs(); renderSessionGrid(); };
    el.appendChild(b);
  });
}

function renderSessionGrid() {
  const grid = document.getElementById('sessionGrid');
  grid.innerHTML = '';
  const week = S.programme.weeks[S.weekIdx];
  week.sessions.forEach(key => {
    const sess = sessions[key];
    const card = document.createElement('div');
    card.className = 'session-card' + (S.sessionKey === key ? ' selected' : '');
    card.innerHTML = `<div class="sc-label">${sess.label}</div><div class="sc-name">${sess.name}</div>`;
    card.onclick = () => { S.sessionKey = key; renderSessionGrid(); renderBlockListPreview(); };
    grid.appendChild(card);
  });
  document.getElementById('blockListWrap').style.display = S.sessionKey ? 'block' : 'none';
  if (S.sessionKey) renderBlockListPreview();
}

function renderBlockListPreview() {
  const sess = sessions[S.sessionKey];
  const el = document.getElementById('blockListPreview');
  el.innerHTML = '';
  sess.blocks.forEach((b, i) => {
    const item = document.createElement('div');
    item.className = 'block-item';
    item.innerHTML = `
      <div class="bi-left">
        <div class="bi-name">${b.name}</div>
        <div class="bi-meta">${b.rounds ? b.rounds + ' rounds · ' : ''}${b.exercises.length} exercises</div>
      </div>
      <div class="bi-arrow">›</div>
    `;
    el.appendChild(item);
  });
}

function startSession() {
  if (!S.sessionKey) { alert('Please select a session first.'); return; }
  S.session = sessions[S.sessionKey];
  S.blockIdx = 0;
  loadBlock(0);
  showScreen('blockview');
}

// ══════════════════════════════════════════
// BLOCK VIEW
// ══════════════════════════════════════════
function loadBlock(idx) {
  S.blockIdx = idx;
  const block = S.session.blocks[idx];
  S.checked = block.exercises.map(() => false);
  stopTimer();

  // Top bar
  document.getElementById('bvSessionName').textContent = S.session.label + ' · ' + S.session.name;
  document.getElementById('bvBlockName').textContent = block.name;

  // Progress dots
  const dots = document.getElementById('blockProgressDots');
  dots.innerHTML = '';
  S.session.blocks.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'bp-dot' + (i < idx ? ' done' : i === idx ? ' active' : '');
    dots.appendChild(d);
  });

  renderBlockBody();
}

function renderBlockBody() {
  const block = S.session.blocks[S.blockIdx];
  const body = document.getElementById('bvBody');
  body.innerHTML = '';

  // Equipment banner
  if (block.equipment && block.equipment.length > 0) {
    const eq = document.createElement('div');
    eq.className = 'equip-banner';
    eq.innerHTML = `<div class="equip-label">📦 You'll need</div><div class="equip-items">${block.equipment.join('<br>')}</div>`;
    body.appendChild(eq);
  }

  // Rounds badge
  if (block.rounds) {
    const rb = document.createElement('div');
    rb.className = 'rounds-badge';
    rb.innerHTML = `<span class="rb-dot"></span> ${block.rounds} rounds · Check off each exercise as you complete it`;
    body.appendChild(rb);
  }

  // Exercise cards
  block.exercises.forEach((ex, i) => {
    const card = document.createElement('div');
    card.className = 'ex-card' + (S.checked[i] ? ' completed' : '');
    card.id = `excard-${i}`;

    // If this is first unchecked exercise, mark as active
    const firstUnchecked = S.checked.indexOf(false);
    if (i === firstUnchecked && !S.checked[i]) card.classList.add('active-ex');

    let timerHTML = '';
    if (ex.timer) {
      timerHTML = `
        <div class="ex-timer-section">
          <button class="timer-start-btn" id="timerbtn-${i}" onclick="launchTimer(${i})">
            ▶ Start ${ex.timer}s Timer
          </button>
        </div>`;
    }

    card.innerHTML = `
      <div class="ex-main" onclick="toggleCheck(${i})">
        <div class="ex-check"><span class="check-icon">✓</span></div>
        <div class="ex-text">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-spec-row">
            <span class="ex-spec">${ex.spec}</span>
            <span style="color:var(--light)">·</span>
            <span class="ex-weight">${ex.weight}</span>
          </div>
        </div>
      </div>
      ${ex.note ? `<div class="ex-note">${ex.note}</div>` : ''}
      ${timerHTML}
    `;
    body.appendChild(card);
  });

  // Rest reminder (if block has rest)
  if (block.rounds && block.rest > 0) {
    const restEl = document.createElement('div');
    restEl.style.cssText = 'padding:14px 16px;border:1px dashed var(--border);border-radius:2px;font-size:11px;color:var(--mid);text-align:center;margin-top:4px;';
    restEl.innerHTML = `Rest ${block.rest}s between rounds`;
    body.appendChild(restEl);
  }
}

function toggleCheck(exIdx) {
  S.checked[exIdx] = !S.checked[exIdx];
  updateCardState(exIdx);
  checkBlockCompletion();
}

function updateCardState(exIdx) {
  const block = S.session.blocks[S.blockIdx];
  const card = document.getElementById(`excard-${exIdx}`);
  if (!card) return;

  card.classList.toggle('completed', S.checked[exIdx]);
  card.classList.remove('active-ex');

  // Mark next unchecked as active
  const firstUnchecked = S.checked.indexOf(false);
  if (firstUnchecked !== -1) {
    const nextCard = document.getElementById(`excard-${firstUnchecked}`);
    if (nextCard) nextCard.classList.add('active-ex');
  }
}

function checkBlockCompletion() {
  const allDone = S.checked.every(v => v);
  if (allDone) {
    setTimeout(() => showBlockComplete(), 400);
  }
}

function showBlockComplete() {
  const block = S.session.blocks[S.blockIdx];
  const isLast = S.blockIdx >= S.session.blocks.length - 1;

  document.getElementById('bcTitle').innerHTML = isLast
    ? 'Session <em>Complete!</em>'
    : 'Block <em>Done!</em>';

  document.getElementById('bcSub').textContent = isLast
    ? 'Amazing work. You\'ve finished the full session.'
    : `${block.name} complete. ${block.rest > 0 ? `Take a ${block.rest}s rest before the next block.` : 'Move straight on when ready.'}`;

  const btn = document.getElementById('bcNextBtn');
  if (isLast) {
    btn.textContent = 'Finish Session ✦';
  } else {
    const next = S.session.blocks[S.blockIdx + 1];
    btn.textContent = `Next: ${next.name} →`;
  }

  document.getElementById('blockComplete').classList.add('visible');
}

function hideBlockComplete() {
  document.getElementById('blockComplete').classList.remove('visible');
}

function goNextBlock() {
  hideBlockComplete();
  const isLast = S.blockIdx >= S.session.blocks.length - 1;
  if (isLast) {
    const weekNum = S.programme.weeks[S.weekIdx].week;
    logSessionComplete(S.programme.id, weekNum, S.sessionKey, S.session.name);
    document.getElementById('scSub').textContent = `${S.session.label}: ${S.session.name} — Week ${weekNum} complete.`;
    showScreen('sessionComplete');
  } else {
    loadBlock(S.blockIdx + 1);
  }
}

function confirmExitBlock() {
  if (confirm('Exit this workout?')) {
    stopTimer();
    showScreen('picker');
  }
}

// ══════════════════════════════════════════
// TIMER
// ══════════════════════════════════════════
const ringFill = document.getElementById('toRingFill');
ringFill.style.strokeDasharray = CIRCUMFERENCE;
ringFill.style.strokeDashoffset = 0;

function launchTimer(exIdx) {
  const block = S.session.blocks[S.blockIdx];
  const ex = block.exercises[exIdx];
  if (!ex.timer) return;

  S.timerExerciseName = ex.name;
  S.timerExerciseSeconds = ex.timer;
  S.timerCallback = () => {
    // Mark exercise as complete after timer finishes
    S.checked[exIdx] = true;
    updateCardState(exIdx);
    checkBlockCompletion();
  };

  startCountdownThenExercise(5, ex.timer, ex.name);
}

function startCountdownThenExercise(countdownSecs, exerciseSecs, exerciseName) {
  const overlay = document.getElementById('timerOverlay');
  const countdown = document.getElementById('toCountdown');
  const number = document.getElementById('toNumber');
  const label = document.getElementById('toLabel');
  const phase = document.getElementById('toPhase');
  const exEl = document.getElementById('toExercise');
  const pauseBtn = document.getElementById('toPauseBtn');

  overlay.classList.add('visible');
  exEl.textContent = exerciseName;
  pauseBtn.style.display = 'none'; // hide pause during countdown

  // Setup ring for countdown
  ringFill.style.stroke = 'var(--accent)';
  ringFill.classList.remove('warning');
  number.classList.remove('warning');

  S.timerPhase = 'countdown';
  S.timerSeconds = countdownSecs;
  S.timerTotal = countdownSecs;
  S.timerPaused = false;

  label.textContent = 'Get Ready';
  phase.textContent = 'Starting in...';
  countdown.textContent = countdownSecs;
  countdown.classList.remove('hidden');
  number.textContent = '';
  setRingProgress(1);

  stopTimer();
  S.timerInterval = setInterval(() => {
    if (S.timerPaused) return;
    S.timerSeconds--;

    if (S.timerPhase === 'countdown') {
      countdown.textContent = S.timerSeconds > 0 ? S.timerSeconds : 'Go!';
      setRingProgress(S.timerSeconds / S.timerTotal);

      if (S.timerSeconds <= 0) {
        // Transition to exercise timer
        setTimeout(() => {
          S.timerPhase = 'exercise';
          S.timerSeconds = exerciseSecs;
          S.timerTotal = exerciseSecs;
          label.textContent = 'Hold';
          phase.textContent = 'In progress';
          countdown.classList.add('hidden');
          number.textContent = S.timerSeconds;
          setRingProgress(1);
          pauseBtn.style.display = '';
        }, 500);
      }
    } else if (S.timerPhase === 'exercise') {
      number.textContent = S.timerSeconds;
      setRingProgress(S.timerSeconds / S.timerTotal);

      const isWarning = S.timerSeconds <= 5;
      ringFill.classList.toggle('warning', isWarning);
      number.classList.toggle('warning', isWarning);
      phase.textContent = S.timerSeconds <= 5 ? 'Almost there...' : 'In progress';

      if (S.timerSeconds <= 0) {
        stopTimer();
        // Done!
        number.textContent = '✓';
        number.classList.remove('warning');
        ringFill.classList.remove('warning');
        ringFill.style.stroke = 'var(--success)';
        label.textContent = 'Done!';
        phase.textContent = '';
        pauseBtn.style.display = 'none';
        // Auto close after 1.2s
        setTimeout(() => {
          closeTimer();
          if (S.timerCallback) S.timerCallback();
        }, 1200);
      }
    }
  }, 1000);
}

function setRingProgress(fraction) {
  const offset = CIRCUMFERENCE * (1 - Math.max(0, Math.min(1, fraction)));
  ringFill.style.strokeDashoffset = offset;
}

function toggleTimerPause() {
  if (S.timerPhase !== 'exercise') return;
  S.timerPaused = !S.timerPaused;
  document.getElementById('toPauseBtn').textContent = S.timerPaused ? 'Resume' : 'Pause';
  document.getElementById('toPhase').textContent = S.timerPaused ? 'Paused' : 'In progress';
}

function closeTimer() {
  stopTimer();
  document.getElementById('timerOverlay').classList.remove('visible');
  document.getElementById('toCountdown').classList.add('hidden');
  document.getElementById('toPauseBtn').textContent = 'Pause';
}

function stopTimer() {
  if (S.timerInterval) { clearInterval(S.timerInterval); S.timerInterval = null; }
}

// ══════════════════════════════════════════
// PROGRESS TRACKING (localStorage)
// ══════════════════════════════════════════
const LOG_KEY = 'training_log_v1';

function loadLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; }
  catch(e) { return []; }
}

function saveLog(log) {
  localStorage.setItem(LOG_KEY, JSON.stringify(log));
}

function logSessionComplete(programmeId, weekNum, sessionKey, sessionName) {
  const log = loadLog();
  log.push({
    programmeId,
    weekNum,
    sessionKey,
    sessionName,
    completedAt: new Date().toISOString()
  });
  saveLog(log);
  updateHomeProgressCount();
}

function isSessionDone(log, programmeId, weekNum, sessionKey) {
  return log.some(e => e.programmeId === programmeId && e.weekNum === weekNum && e.sessionKey === sessionKey);
}

function updateHomeProgressCount() {
  const log = loadLog();
  const total = programmes.reduce((n, p) => n + p.weeks.reduce((m, w) => m + w.sessions.length, 0), 0);
  const done = log.length;
  const el = document.getElementById('homeProgressCount');
  if (el) el.textContent = done > 0 ? `${done} / ${total} sessions` : '';
}

function showProgressScreen() {
  renderProgressScreen();
  showScreen('progress');
}

function renderProgressScreen() {
  const log = loadLog();
  const body = document.getElementById('progressBody');
  body.innerHTML = '';

  programmes.forEach(prog => {
    // Summary stats
    const totalSessions = prog.weeks.reduce((n, w) => n + w.sessions.length, 0);
    const doneSessions = prog.weeks.reduce((n, w) =>
      n + w.sessions.filter(k => isSessionDone(log, prog.id, w.week, k)).length, 0);
    const weeksStarted = new Set(log.filter(e => e.programmeId === prog.id).map(e => e.weekNum)).size;

    const summary = document.createElement('div');
    summary.className = 'prog-summary';
    summary.innerHTML = `
      <div class="prog-stat"><div class="prog-stat-num">${doneSessions}</div><div class="prog-stat-label">Sessions Done</div></div>
      <div class="prog-stat"><div class="prog-stat-num">${totalSessions - doneSessions}</div><div class="prog-stat-label">Remaining</div></div>
      <div class="prog-stat"><div class="prog-stat-num">${weeksStarted}</div><div class="prog-stat-label">Weeks Active</div></div>
    `;
    body.appendChild(summary);

    // Find next session to do
    let nextWeekNum = null, nextSessionKey = null;
    outer: for (const w of prog.weeks) {
      for (const k of w.sessions) {
        if (!isSessionDone(log, prog.id, w.week, k)) {
          nextWeekNum = w.week;
          nextSessionKey = k;
          break outer;
        }
      }
    }

    // Week-by-week breakdown
    prog.weeks.forEach(w => {
      const weekEl = document.createElement('div');
      weekEl.className = 'prog-week';

      const weekTitle = document.createElement('div');
      weekTitle.className = 'prog-week-title';
      weekTitle.textContent = `Week ${w.week}`;
      weekEl.appendChild(weekTitle);

      w.sessions.forEach(k => {
        const sess = sessions[k];
        const done = isSessionDone(log, prog.id, w.week, k);
        const isCurrent = (w.week === nextWeekNum && k === nextSessionKey);
        const entry = log.find(e => e.programmeId === prog.id && e.weekNum === w.week && e.sessionKey === k);

        const row = document.createElement('div');
        row.className = 'prog-session-row' + (done ? ' done' : isCurrent ? ' current' : '');
        row.innerHTML = `
          <div class="psr-tick">${done ? '✓' : ''}</div>
          <div class="psr-info">
            <div class="psr-name">${sess.label} — ${sess.name}</div>
            <div class="psr-meta">${done ? 'Completed ' + formatDate(entry.completedAt) : isCurrent ? 'Up next' : 'Not yet started'}</div>
          </div>
          <div class="psr-badge">${done ? 'Done' : isCurrent ? 'Next' : '—'}</div>
        `;
        weekEl.appendChild(row);
      });

      body.appendChild(weekEl);
    });

    // Reset button
    const resetBtn = document.createElement('button');
    resetBtn.className = 'prog-reset-btn';
    resetBtn.textContent = 'Reset All Progress';
    resetBtn.onclick = () => {
      if (confirm('Reset all progress? This cannot be undone.')) {
        try {
          localStorage.removeItem(LOG_KEY);
          localStorage.setItem(LOG_KEY, JSON.stringify([]));
        } catch(e) {}
        updateHomeProgressCount();
        renderProgressScreen();
        alert('Progress reset successfully.');
      }
    };
    body.appendChild(resetBtn);
  });
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
renderHome();
updateHomeProgressCount();
</script>
